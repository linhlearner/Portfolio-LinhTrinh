<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Building a physical gas trade</title><desc id="desc">A four-step framework: identify a spread, verify transport access, check delivery and contracts, assess risks. No trade locations or confidential details are shown.</desc><rect width="900" height="520" fill="#f4f7fa"/><text x="52" y="76" font-family="EB Garamond,Georgia,serif" font-size="45" fill="#13376c">Building a physical gas trade</text><text x="52" y="114" font-family="EB Garamond,Georgia,serif" font-size="22" fill="#52667b">From market signal to executable decision</text><g font-family="EB Garamond,Georgia,serif" text-anchor="middle" fill="#13376c"><rect x="40" y="190" width="190" height="155" rx="6" fill="#dceef6"/><text x="135" y="243" font-size="25">01 / Identify</text><text x="135" y="278" font-size="22">the spread</text><rect x="250" y="190" width="190" height="155" rx="6" fill="#e7eff6"/><text x="345" y="243" font-size="25">02 / Verify</text><text x="345" y="278" font-size="22">transport</text><rect x="460" y="190" width="190" height="155" rx="6" fill="#f6e9bd"/><text x="555" y="243" font-size="25">03 / Confirm</text><text x="555" y="278" font-size="22">delivery</text><rect x="670" y="190" width="190" height="155" rx="6" fill="#dceef6"/><text x="765" y="243" font-size="25">04 / Assess</text><text x="765" y="278" font-size="22">execution risk</text></g><g fill="none" stroke="#1d9eb6" stroke-width="3"><path d="M232 268h16m-8 -7 8 7 -8 7"/><path d="M442 268h16m-8 -7 8 7 -8 7"/><path d="M652 268h16m-8 -7 8 7 -8 7"/></g><text x="450" y="414" font-family="EB Garamond,Georgia,serif" text-anchor="middle" font-size="32" fill="#13376c">A quoted spread is not an executable trade.</text><text x="450" y="462" font-family="EB Garamond,Georgia,serif" text-anchor="middle" font-size="20" fill="#52667b">McGill Commodities Trading Club · Senior Analyst</text></svg>