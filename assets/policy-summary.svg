<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520"><rect width="900" height="520" fill="#f0ede7"/><text x="55" y="75" font-family="Georgia" font-size="35" fill="#13376c">Policy can steer. Adoption is another step.</text><text x="55" y="110" font-family="Arial" font-size="17" fill="#647079">Conceptual framework from ECON 473 essay</text><g font-family="Georgia" font-size="23" fill="#13376c" text-anchor="middle"><rect x="40" y="215" width="190" height="105" rx="3" fill="#dceef6"/><text x="135" y="261">Policy</text><text x="135" y="287">incentives</text><rect x="250" y="215" width="190" height="105" rx="3" fill="#f6e9bd"/><text x="345" y="261">Technical</text><text x="345" y="287">change</text><rect x="460" y="215" width="190" height="105" rx="3" fill="#d9e8f1"/><text x="555" y="261">Adoption</text><text x="555" y="287">barriers</text><rect x="670" y="215" width="190" height="105" rx="3" fill="#e9f2f8"/><text x="765" y="261">Productivity</text><text x="765" y="287">outcomes</text></g><g stroke="#1d9eb6" stroke-width="2" fill="none"><path d="M230 268h20m-9 -7 9 7 -9 7M440 268h20m-9 -7 9 7 -9 7M650 268h20m-9 -7 9 7 -9 7"/></g><text x="450" y="399" text-anchor="middle" font-family="Georgia" font-size="26" fill="#1d9eb6">Direction does not guarantee diffusion.</text></svg>